# Chạy trên VPS: docker compose up -d --build
#
# Hai cách chạy:
# 1) VPS đã có Caddy/Nginx riêng giữ cổng 80/443 (như VPS mkt.baor.vn): chỉ chạy app,
#    app lắng nghe 127.0.0.1:${APP_PORT} (mặc định 3200), proxy của máy chủ trỏ vào đó.
# 2) VPS trống: chạy kèm Caddy trong Docker để tự cấp HTTPS:
#    docker compose --profile caddy up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${APP_PORT:-3200}:3000"
    volumes:
      - app_data:/app/data   # cơ sở dữ liệu SQLite, giữ nguyên khi cập nhật

  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  app_data:
  caddy_data:
  caddy_config:

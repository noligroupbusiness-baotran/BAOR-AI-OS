# Tự động cập nhật VPS mỗi khi push (tùy chọn).
# Cách 1 (khuyên dùng, không cần secret): trên VPS chạy một lần
#   bash /opt/baor-ai-os/deploy/enable-auto-update.sh
# VPS sẽ tự kiểm tra GitHub mỗi 2 phút và cập nhật khi có commit mới.
#
# Cách 2: thêm 3 secret trong GitHub (Settings > Secrets and variables > Actions):
#   VPS_HOST     IP hoặc tên miền VPS
#   VPS_USER     user SSH (thường là root)
#   VPS_SSH_KEY  nội dung private key SSH
# Chưa có secret thì workflow chỉ ghi chú và kết thúc thành công, không báo lỗi.
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kiểm tra secret SSH
        id: secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Bỏ qua deploy qua SSH::Chưa có VPS_HOST / VPS_USER / VPS_SSH_KEY. VPS vẫn tự cập nhật nếu đã bật deploy/enable-auto-update.sh."
          fi

      - name: Cập nhật ứng dụng trên VPS
        if: steps.secrets.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            if [ ! -d /opt/baor-ai-os/.git ]; then
              BRANCH="${GITHUB_REF_NAME}" bash <(curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/deploy/install.sh)
            else
              bash /opt/baor-ai-os/deploy/update.sh
            fi
          envs: GITHUB_REF_NAME,GITHUB_REPOSITORY
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
